name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run tests
      run: |
        pytest --cov=src/agentft --cov-report=xml --cov-report=term
    - name: Regression Gate Sanity
      run: |
        python - <<'PY'
        import json
        import tempfile
        from pathlib import Path
        import subprocess

        with tempfile.TemporaryDirectory() as tmp:
            run_a = Path(tmp) / "run_a"
            run_b = Path(tmp) / "run_b"
            run_a.mkdir()
            run_b.mkdir()
            rows_a = [
                {"scenario":"s","task_id":"1","agent":"a","judge":"j","passed":True},
                {"scenario":"s","task_id":"2","agent":"a","judge":"j","passed":False},
            ]
            rows_b = [
                {"scenario":"s","task_id":"1","agent":"a","judge":"j","passed":True},
                {"scenario":"s","task_id":"2","agent":"a","judge":"j","passed":False},
            ]
            (run_a / "results.jsonl").write_text("".join(json.dumps(r)+"\n" for r in rows_a), encoding="utf-8")
            (run_b / "results.jsonl").write_text("".join(json.dumps(r)+"\n" for r in rows_b), encoding="utf-8")
            cmd = ["aft", "gate", "--run-a", str(run_a), "--run-b", str(run_b), "--max-regressions", "0"]
            subprocess.run(cmd, check=True)
        PY
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
